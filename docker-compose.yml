# Optional Kafka + Redis stack for the Lab 4 demo.
#
# Bring it up with:    docker compose up -d
# Tear it down with:   docker compose down
#
# After services are running, set `output.dry_run: false` in config.yaml
# and pick `kafka` or `redis` as the strategy. Real messages will flow.

version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: lab4-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Single-node Kafka in KRaft mode (no separate Zookeeper required).
  kafka:
    image: bitnami/kafka:3.7
    container_name: lab4-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
