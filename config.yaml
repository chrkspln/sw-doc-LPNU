# ==============================================================================
# Lab 4 — Strategy pattern configuration
# ------------------------------------------------------------------------------
# To switch the output destination, change ONE line below: `output.strategy`.
# No code changes are required to switch between console / kafka / redis.
# ==============================================================================

input:
  file: data/sample.csv.gz

output:
  strategy: console     # one of: console | kafka | redis

  kafka:
    bootstrap_servers: ["localhost:9092"]
    topic: storm-events

  redis:
    host: localhost
    port: 6379
    db: 0
    key: storm-events
